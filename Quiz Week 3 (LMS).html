<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body style="margin:0; background-image:url('https://lms.prasetiyamulya.ac.id/pluginfile.php/1/theme_moove/loginbgimg/1787063519/bg_login_mdl.jpg'); background-size:cover; background-position:center; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Arial, sans-serif;">

<div style="width:400px; background:white; padding:40px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">

  <div style="text-align:center; margin-bottom:30px;">
    <img src="https://lms.prasetiyamulya.ac.id/pluginfile.php/1/theme_moove/logo/1787063519/logo_upm_biru.png" alt="Universitas Prasetiya Mulya" style="width:100%; max-width:300px;">
  </div>

  <div style="margin-bottom:15px;">
    <input type="text" placeholder="Username or email" style="width:100%; padding:14px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;">
  </div>

  <div style="margin-bottom:20px;">
    <input type="password" placeholder="Password" style="width:100%; padding:14px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;">
  </div>

  <div style="margin-bottom:15px;">
    <button style="width:100%; padding:14px; background:gray; color:white; border:none; border-radius:6px; font-size:16px;">Log in</button>
  </div>

  <div style="text-align:center; margin-bottom:20px;">
    <a href="#" style="color:gray; text-decoration:none;">Lost password?</a>
  </div>

  <div style="margin-bottom:10px;">
    This site best viewed in Google Chrome.
  </div>

  <div style="text-align:right; color:gray;">
    ❓ Cookies notice
  </div>

</div>

</body>
</html>
